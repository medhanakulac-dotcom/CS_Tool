<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS Tool — Customer Success</title>
<style>
:root{--bg:#f5f0e9;--card:#fff;--ink:#1d1d1b;--mute:#8a8178;--tan:#b9a98f;--line:#ece4d8;--pill:#f0eadf;
 --teal:#3e9d8c;--mint:#e3f5ef;--amber:#c47f1e;--amber-bg:#fbf1dc;--red:#cc3f6e;--pink:#fbe9ec;--ok:#3f9a5b;--okbg:#e6f6ec;--purple:#7a5cf0;--purplebg:#efe9fb;
 --shadow:0 1px 2px rgba(80,60,30,.06),0 8px 24px rgba(80,60,30,.04);
 --sans:Inter,-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select,textarea{font-family:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{font:800 18px var(--sans);letter-spacing:-.02em;padding:0 10px}
.brand small{display:block;font:500 12px var(--sans);color:var(--tan);letter-spacing:0}
#snav{margin-top:22px;display:flex;flex-direction:column;gap:4px}
#snav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;font:600 14.5px var(--sans);color:#6f665c;cursor:pointer}
#snav button:hover{background:var(--bg)}
#snav button.on{background:var(--mint);color:var(--teal)}
#snav .ic{width:20px;text-align:center;font-size:16px}
#snav .cnt{margin-left:auto;font:700 11px var(--sans);border-radius:999px;padding:1px 8px;background:var(--pill);color:var(--mute)}
#snav .cnt.warn{background:var(--amber);color:#fff}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;font:800 13px var(--sans);flex:none}
.me b{display:block;font-size:14px}.me span{font-size:12px;color:var(--mute)}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 32px;position:sticky;top:0;background:var(--bg);z-index:8}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;border:0;background:#fff;border-radius:14px;padding:11px 16px 11px 40px;font-size:14px;box-shadow:var(--shadow);outline:none}
.search input:focus{box-shadow:0 0 0 2px #cfe8e2}
.search::before{content:"⌕";position:absolute;left:15px;top:8px;font-size:18px;color:var(--tan)}
#gres{position:absolute;top:46px;left:0;right:0;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(60,40,20,.15);overflow:hidden;display:none;z-index:20}
#gres .it{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;cursor:pointer;font-size:14px}
#gres .it:hover{background:var(--bg)}
.ownerf{display:flex;align-items:center;gap:8px;font:800 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tan)}
.ownerf select{font:600 14px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink);background:#fff;border:0;border-radius:12px;padding:9px 14px;box-shadow:var(--shadow);cursor:pointer}
.ownerf.on select{background:var(--mint);color:var(--teal)}
.week{font-size:12.5px;color:var(--tan);margin-left:auto;white-space:nowrap}
main{padding:8px 32px 80px;max-width:1240px}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 0 2px}
.sub{font-size:13.5px;color:var(--mute)}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 20px}
.crumb{font-size:13px;color:var(--mute);margin-bottom:6px}
.crumb button{background:none;border:0;padding:0;color:var(--teal);font:600 13px var(--sans);cursor:pointer}
h2.st{font:800 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tan);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow)}
.card.human{background:#fbeee0;box-shadow:inset 0 0 0 2px var(--amber)}
.card.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.card.click:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(80,60,30,.08),0 14px 36px rgba(80,60,30,.09)}
.lab{font:800 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tan)}
.big{font:800 34px var(--sans);letter-spacing:-.02em;line-height:1.1;margin:6px 0 2px}
.d{font-size:13px;color:var(--mute)}
.go{color:var(--teal);font-weight:700}.human .go{color:var(--amber)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.25fr 1fr}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.b{font:600 13px var(--sans);border:0;background:#fff;box-shadow:var(--shadow);color:var(--ink);border-radius:12px;padding:8px 16px;cursor:pointer;white-space:nowrap}
.b:hover{box-shadow:0 0 0 2px var(--line)}
.b:disabled{opacity:.5;cursor:default}
.b.on{background:var(--ink);color:#fff}
.b.pri{background:var(--amber-bg);color:var(--amber)}.b.pri:hover{background:var(--amber);color:#fff}
.b.rj{background:var(--pink);color:var(--red)}
.b.tl{background:var(--mint);color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg,.hl,.tg{font:700 12.5px var(--sans);border-radius:10px;padding:3px 11px;white-space:nowrap;display:inline-block}
.seg.High{background:var(--mint);color:var(--teal)}.seg.Mid{background:var(--purplebg);color:var(--purple)}.seg.Low{background:var(--amber-bg);color:var(--amber)}.seg.Dormant{background:#ebe5db;color:#8a8178}
.hl.Unhealthy{background:var(--pink);color:var(--red)}.hl.Adopted{background:var(--amber-bg);color:var(--amber)}.hl.Healthy{background:var(--okbg);color:var(--ok)}
.tg{background:var(--pill);color:var(--mute)}.tg.llm{background:var(--purplebg);color:var(--purple)}
.st.approved{background:var(--okbg);color:var(--ok)}.st.rejected{background:var(--pink);color:var(--red)}.st.pending{background:var(--amber-bg);color:var(--amber)}.st.healthy{background:var(--okbg);color:var(--ok)}.st.hold,.st.reactive{background:var(--pill);color:var(--mute)}
.risk{font:700 12px var(--sans);border-radius:999px;padding:2px 10px;background:var(--pill);white-space:nowrap}.risk.hi{background:var(--amber-bg);color:var(--amber)}
.chip{font:600 12.5px var(--sans);padding:3px 11px;border-radius:999px;background:var(--bg);display:inline-block;margin:0 4px 4px 0;white-space:nowrap}
/* tabs / toolbar */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 14px var(--sans);color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--teal);border-color:var(--teal)}
.tabs .n{font-size:11px;background:var(--pill);border-radius:999px;padding:1px 8px;margin-left:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input,.tools select{border:0;background:#fff;border-radius:12px;padding:9px 14px;font:500 14px var(--sans);box-shadow:var(--shadow);outline:none}
.tools input{min-width:220px}
.tools .sp{margin-left:auto}
/* table */
.tw{background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:800 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--tan);text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
td{padding:13px 12px;border-bottom:1px solid #f3ede3;vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr[data-open]{cursor:pointer}tbody tr[data-open]:hover td{background:#faf6f0}
.acct{display:flex;gap:12px;align-items:center}
.acct b{display:block}
/* board */
.board{display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:#ede6da;border-radius:20px;padding:12px;min-height:200px}
.col h3{font:800 12px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:#8a7f6e;margin:4px 6px 10px;display:flex;justify-content:space-between}
.kc{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.kc:hover{box-shadow:0 0 0 2px var(--line)}
.kc .l{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kc .m{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* record */
.rh{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.rh .av{width:56px;height:56px;font-size:20px;border-radius:18px}
.rl{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;gap:18px;align-items:start}
@media(max-width:1100px){.rl{grid-template-columns:1fr}}
.prop{display:grid;grid-template-columns:104px 1fr;gap:10px 8px;font-size:14px;align-items:center}
.prop b{font:600 12.5px var(--sans);color:var(--mute)}
.dots{display:flex;gap:5px}.dots i{width:16px;height:16px;border-radius:50%;background:var(--pill)}.dots i.on{background:#5bbfae}
.box2{background:var(--bg);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.6;margin-bottom:12px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;padding:0 0 18px}
.ev::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #cbbda6}
.ev.ai::before{border-color:var(--purple)}.ev.qa::before,.ev.ok::before{border-color:var(--ok)}.ev.bad::before{border-color:var(--red)}.ev.note::before{border-color:var(--amber)}.ev.signal::before{border-color:var(--teal)}
.ev .t{font-size:12px;color:var(--tan);font-weight:600}
.notein{display:flex;gap:8px;margin-bottom:18px}.notein input{flex:1;border:0;background:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;outline:none}
/* approvals */
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.q{background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.qi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #f3ede3;padding:14px 18px;cursor:pointer;font:14px var(--sans);color:var(--ink)}
.qi:hover{background:#faf6f0}.qi.on{background:var(--amber-bg);box-shadow:inset 4px 0 0 var(--amber)}
.qi .l1{display:flex;justify-content:space-between;gap:8px}.qi .l2{display:flex;justify-content:space-between;margin-top:4px;font-size:12px;color:var(--mute);gap:6px}
.langbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:#fff;border-radius:16px;margin:12px 0}
.langbar .lb{font:800 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tan);margin-right:6px}
.langbar .b{box-shadow:none;background:var(--bg);padding:6px 14px}.langbar .b.on{background:var(--ink);color:#fff}
.mail{font-size:13px;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:10px;line-height:1.7}
.draft{background:var(--bg);border-radius:16px;padding:18px 20px;white-space:pre-wrap;font-size:14.5px;margin:14px 0;line-height:1.7}
.card.human .draft{background:#f8efe4}
textarea,.inp{width:100%;font:14.5px var(--sans);background:#fff;color:var(--ink);border:1.5px solid #cfe8e2;border-radius:14px;padding:12px;margin:12px 0}
textarea{min-height:220px}.inp{border-color:#f0c4d0;margin:0}
.void{font:600 12.5px var(--sans);color:var(--red);background:var(--pink);border-radius:12px;padding:8px 12px;margin-top:10px}
.gen{font:600 13px var(--sans);color:var(--purple)}
.log{background:#fff;border-radius:16px;padding:14px 16px;font:12.5px ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;color:#4a4238}
.bars .r{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;padding:6px 8px;margin:0 -8px;border-radius:10px;font-size:14px;cursor:pointer}
.bars .r:hover{background:var(--bg)}.tr{height:10px;background:var(--pill);border-radius:999px}.fl{height:100%;border-radius:999px;background:#5bbfae}.fl.hi{background:#e0a03a}
.task{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid #f3ede3}
.task:last-child{border:0}.task .grow{flex:1;min-width:0}
.task b{display:block}
.sec{display:flex;align-items:center;gap:14px;margin:38px 0 16px;font:800 20px var(--sans);letter-spacing:-.01em}
details.h>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;font:800 18px var(--sans);margin:30px 0 14px;color:var(--ink)}
details.h>summary::-webkit-details-marker{display:none}
details.h>summary::after{content:"▾";margin-left:auto;color:var(--tan);font-size:14px}
details.h[open]>summary::after{content:"▴"}
details.h>summary small{font:500 13px var(--sans);color:var(--mute)}
.mx{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:8px}
.mxh{display:flex;align-items:center;gap:7px;font:800 13px var(--sans);padding:0 4px}.mxh i{width:10px;height:10px;border-radius:50%}
.mxr{background:#fff;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;justify-content:center;box-shadow:var(--shadow)}
.mxr b{font-size:16px}
.cell{border-radius:16px;padding:12px 16px}.cell b{font-size:15px;display:block}.cell .d{font-size:12px;line-height:1.45}
.cell.Unhealthy{background:var(--pink)}.cell.Unhealthy b{color:var(--red)}.cell.Adopted{background:var(--amber-bg)}.cell.Adopted b{color:var(--amber)}.cell.Healthy{background:#e9f7ee}.cell.Healthy b{color:var(--ok)}.cell.Dormant{background:#efe9df;grid-column:2/5}
.cell .ops span{font:600 11px var(--sans);background:#fff;border-radius:999px;padding:1px 8px;margin:4px 4px 0 0;display:inline-block}
.gl{display:grid;grid-template-columns:1fr;gap:14px}
.gr{display:grid;grid-template-columns:100px 1fr;gap:14px;align-items:center;padding:10px 0;border-top:1px solid #f0e9de;font-size:14px;color:#5d554b}
.gr3{grid-template-columns:100px 130px 1fr}
body.nosb .app{grid-template-columns:minmax(0,1fr)}
body.nosb .side{display:none}
.sbbtn{border:0;background:#fff;box-shadow:var(--shadow);border-radius:12px;width:40px;height:40px;font-size:18px;color:#6f665c;cursor:pointer;flex:none}
.sbbtn:hover{background:var(--mint);color:var(--teal)}
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.brandrow .sbbtn{width:32px;height:32px;font-size:14px;box-shadow:none;background:var(--bg)}
body.nosb .topbar{padding-left:24px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font:600 14px var(--sans);opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:column;padding:12px}
 #snav{flex-direction:row;overflow-x:auto;margin-top:10px}.me{display:none}
 .topbar{padding:12px 16px;flex-wrap:wrap}main{padding:8px 16px 60px}.week{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brandrow"><div class="brand">CS Tool<small>customer success</small></div><button class="sbbtn" data-sb="1" title="Hide sidebar" aria-label="Hide sidebar">«</button></div>
    <nav id="snav"></nav>
    <div class="me"><span class="av">C</span><div><b>Chris</b><span>Customer Success lead</span></div></div>
  </aside>
  <div>
    <header class="topbar">
      <button class="sbbtn" data-sb="1" id="sbtop" title="Show / hide sidebar" aria-label="Toggle sidebar">☰</button>
      <div class="search"><input id="gsearch" placeholder="Search accounts…" autocomplete="off"><div id="gres"></div></div>
      <label class="ownerf"><span>Owner</span><select id="ownersel"></select></label>
      <span class="week" id="srcbadge">Week 2026-W40 · run_manifest ok</span>

  </div>
</div>
<div id="toast"></div>
<script src="hubspot-data.js"></script>
<script>
const rid=()=>Math.random().toString(16).slice(2,10);
const PLAY_OUT={Retention:"OUT-1",Adoption:"OUT-2",Commercial:"OUT-3"};
const DET={"HubSpot health":"CRM-1","HubSpot activity":"CRM-2","Volume":"ANL-1","Route peer":"ANL-2","Fare index":"ANL-3","Adoption":"ANL-4"};
const SEG=["High","Mid","Low"], HEALTH=["Unhealthy","Adopted","Healthy"];
const healthOf=f=>f>=5?"Healthy":f>=3?"Adopted":"Unhealthy";
const MATRIX={
 High:{Unhealthy:["Rescue","Move Unhealthy → Adopted → Healthy. Always asks for a call."],Adopted:["Push to Healthy","Move Adopted → Healthy."],Healthy:["Grow","Expand value and partnership."]},
 Mid:{Unhealthy:["Adoption Push","Improve adoption."],Adopted:["Maintain / Light Push","Acceptable baseline — light push on remaining features."],Healthy:["Maintain","Maintain engagement."]},
 Low:{Unhealthy:["Automated Activation","Automated activation sequence."],Adopted:["Self-Service / Nudge","Self-serve, with the occasional automated nudge."],Healthy:["Self-Service","Self-service engagement."]}
};
const hOf=c=>c.hs?c.hs.health:healthOf(c.features);
const LIVE=!!window.HS_ACCOUNTS;
const playbookOf=c=>c.segment==="Dormant"?["Reactive Only","No proactive touchpoints — respond to inbound requests only."]:MATRIX[c.segment][hOf(c)];
const ALLC=[
 {id:"C-101",op:"Aero Nusantara",segment:"High",features:1,owner:"Rina P.",email:"rina@aero-nusantara.example",play:"Retention",risk:87,sig:[["Volume","Volume −23% WoW"],["Route peer","Route peer −11 pts"]]},
 {id:"C-102",op:"Blue Kestrel Air",segment:"High",features:4,owner:"Tom W.",email:"tom@bluekestrel.example",play:"Commercial",risk:74,sig:[["Fare index","Fare index 1.18 vs peer median"]]},
 {id:"C-103",op:"Coral Jet",segment:"Mid",features:2,owner:"Mei L.",email:"mei@coraljet.example",play:"Adoption",risk:61,sig:[["Adoption","WAO 12%"],["Adoption","2 features unused"]]},
 {id:"C-104",op:"Delta Meridian",segment:"Mid",features:3,owner:"Sam K.",email:"sam@deltameridian.example",play:"Retention",risk:55,sig:[["Volume","Volume −14% WoW"]]},
 {id:"C-105",op:"Ember Wings",segment:"Low",features:3,owner:"Lia T.",email:"lia@emberwings.example",play:"Adoption",risk:42,sig:[["Adoption","WAO 21%"]]},
 {id:"C-106",op:"Fjord Air",segment:"Dormant",features:0,owner:"—",email:"",play:"Retention",risk:30,sig:[["Volume","No bookings in 6 weeks"]],dormant:1}
].map(c=>({...c,state:c.dormant?"reactive":"pending",hash:rid()}));
const WHY={
 "C-101":["Bookings on the top 3 routes fell 23% WoW while the market moved only −4%, and the route-peer gap widened 11 pts. This looks account-specific, not seasonal, and only 1 of 6 core features is in weekly use.","Rescue play: book a 20-minute call with Rina this week and recommend Route Alerts, Route Peer Benchmark and the Agent Activity Report."],
 "C-102":["Average fare on CNX–BKK is 18% above the peer median, which may be costing share. The account already uses 4 of 6 features, so the commercial gap is the main blocker to Healthy.","Recommend the Fare Index Benchmark and a Fare Class Pricing Test, with the fare-class breakdown attached."],
 "C-103":["Only 12% of agents were active weekly and 2 features are unused. With just 2 of 6 features in use, adoption is the issue, not volume.","Recommend Ancillary Bundling and Agent Invitations; aim for one new feature live within 2 weeks."],
 "C-104":["Volume is down 14% WoW but 3 of 6 features are active, so the account is usable. Worth a light check-in before the dip becomes a trend.","Send a short check-in; no escalation needed yet."],
 "C-105":["Low-segment account at 3 features with 21% weekly activity. Self-service is the right motion here.","Send the two-feature guide; no owner time needed."],
 "C-106":["No bookings for 6 weeks and no live engagement. Per the playbook this account is reactive only.","Do not reach out; respond only if they contact us."]
};
/* ── detailed email drafts, 4 languages (LLM output, simulated in this prototype) ── */
const LANGS={en:"English",th:"ไทย",vi:"Tiếng Việt",id:"Bahasa Indonesia"};
const LP={

 vi:{subj:"Lượt đặt chỗ trên các đường bay chính giảm 23% — xin hẹn trao đổi và các tính năng có thể giúp",greet:"Kính gửi Rina,",intro:"Đội ngũ seatOS đã xem xét dữ liệu tuần này của Aero Nusantara và có một vài tín hiệu chúng tôi muốn chia sẻ:",pts:["Lượt đặt chỗ trên 3 đường bay chính giảm 23% so với tuần trước, trong khi thị trường trên cùng các đường bay chỉ thay đổi −4%.","Khoảng cách so với các hãng cùng nhóm đã nới rộng thêm 11 điểm.","Chỉ có 1 trong 6 tính năng cốt lõi có người dùng hoạt động hằng tuần (Weekly Active Operator)."],sign:"Trân trọng,\nChris"},
 id:{subj:"Pemesanan di rute utama turun 23% — mohon jadwal bicara dan fitur yang membantu",greet:"Yth. Rina,",intro:"Tim seatOS telah meninjau data mingguan Aero Nusantara dan menemukan beberapa sinyal yang ingin kami sampaikan:",pts:["Pemesanan di 3 rute utama turun 23% dibandingkan minggu lalu, sementara pasar di rute yang sama hanya bergerak −4%.","Selisih dengan maskapai pembanding melebar 11 poin.","Hanya 1 dari 6 fitur inti yang memiliki pengguna aktif mingguan (Weekly Active Operator)."],sign:"Hormat kami,\nChris"}},
"C-102":{
 en:{subj:"Your CNX–BKK fares vs. the peer median",greet:"Hi Tom,",intro:"We reviewed Blue Kestrel Air's fare position this week and wanted to share what we found:",pts:["Your average fare on CNX–BKK is 18% above the peer median (fare index 1.18).","That premium may be costing share on price-sensitive itineraries; the breakdown by fare class is attached.","You already use 4 of 6 core features, so pricing is the main gap left."],sign:"Best regards,\nChris"},
 th:{subj:"ราคาตั๋วเส้นทาง CNX–BKK เทียบกับค่ามัธยฐานของคู่เทียบ",greet:"เรียนคุณ Tom,",intro:"ทีม seatOS ตรวจสอบตำแหน่งราคาของ Blue Kestrel Air ในสัปดาห์นี้ และมีข้อมูลที่อยากแบ่งปัน:",pts:["ราคาตั๋วเฉลี่ยบนเส้นทาง CNX–BKK สูงกว่าค่ามัธยฐานของคู่เทียบ 18% (ดัชนีราคา 1.18)","ส่วนต่างนี้อาจทำให้เสียส่วนแบ่งในกลุ่มผู้โดยสารที่อ่อนไหวต่อราคา เราแนบรายละเอียดแยกตามชั้นราคามาด้วยแล้ว","คุณใช้ฟีเจอร์หลักไปแล้ว 4 จาก 6 ฟีเจอร์ ราคาจึงเป็นช่องว่างหลักที่เหลืออยู่"],sign:"ขอแสดงความนับถือ\nChris"},
 vi:{subj:"Giá vé CNX–BKK so với trung vị của các hãng cùng nhóm",greet:"Kính gửi Tom,",intro:"Đội ngũ seatOS đã xem xét vị thế giá của Blue Kestrel Air trong tuần này và muốn chia sẻ những gì chúng tôi nhận thấy:",pts:["Giá vé trung bình trên đường bay CNX–BKK cao hơn trung vị của các hãng cùng nhóm 18% (chỉ số giá 1,18).","Mức chênh này có thể khiến bạn mất thị phần ở nhóm khách nhạy cảm về giá; chúng tôi đã đính kèm bảng phân tích theo hạng vé.","Bạn đã sử dụng 4 trong 6 tính năng cốt lõi, nên giá là khoảng cách chính còn lại."],sign:"Trân trọng,\nChris"},
 id:{subj:"Tarif CNX–BKK dibandingkan median pesaing",greet:"Yth. Tom,",intro:"Tim seatOS telah meninjau posisi tarif Blue Kestrel Air minggu ini dan ingin membagikan temuan kami:",pts:["Tarif rata-rata di rute CNX–BKK 18% di atas median pesaing (indeks tarif 1,18).","Selisih ini berpotensi mengurangi pangsa pasar pada penumpang yang sensitif harga; rincian per kelas tarif kami lampirkan.","Anda sudah memakai 4 dari 6 fitur inti, sehingga harga menjadi kesenjangan utama yang tersisa."],sign:"Hormat kami,\nChris"}},

 en:{subj:"Getting more from ancillary bundling",greet:"Hi Mei,",intro:"Looking at Coral Jet's usage last week, we see a clear opportunity on adoption:",pts:["Only 12% of your agents were active on seatOS each week.","2 features are not in use yet, including ancillary bundling.","Teams that switch bundling on typically see a lift in attach rate."],sign:"Best regards,\nChris"},
 th:{subj:"ใช้ประโยชน์จากการขายแบบบันเดิลบริการเสริมให้มากขึ้น",greet:"เรียนคุณ Mei,",intro:"จากการใช้งานของ Coral Jet ในสัปดาห์ที่ผ่านมา เราเห็นโอกาสชัดเจนด้านการใช้งานฟีเจอร์:",pts:["มีเอเจนต์เพียง 12% ที่ใช้งาน seatOS เป็นประจำทุกสัปดาห์","ยังมี 2 ฟีเจอร์ที่ยังไม่ได้เปิดใช้ รวมถึงการขายแบบบันเดิลบริการเสริม","ทีมที่เปิดใช้บันเดิลมักมีอัตราการขายพ่วง (attach rate) เพิ่มขึ้น"],sign:"ขอแสดงความนับถือ\nChris"},
 vi:{subj:"Khai thác tốt hơn tính năng bán gói dịch vụ bổ sung",greet:"Kính gửi Mei,",intro:"Xem xét việc sử dụng của Coral Jet tuần trước, chúng tôi thấy một cơ hội rõ ràng về mức độ áp dụng tính năng:",pts:["Chỉ 12% đại lý hoạt động trên seatOS mỗi tuần.","Còn 2 tính năng chưa được sử dụng, trong đó có bán gói dịch vụ bổ sung (bundling).","Các đội bật bundling thường ghi nhận tỷ lệ bán kèm (attach rate) tăng lên."],sign:"Trân trọng,\nChris"},
 id:{subj:"Manfaatkan bundling layanan tambahan lebih optimal",greet:"Yth. Mei,",intro:"Dari penggunaan Coral Jet minggu lalu, kami melihat peluang yang jelas pada adopsi fitur:",pts:["Hanya 12% agen yang aktif menggunakan seatOS setiap minggu.","Masih ada 2 fitur yang belum digunakan, termasuk bundling layanan tambahan.","Tim yang mengaktifkan bundling umumnya mengalami kenaikan attach rate."],sign:"Hormat kami,\nChris"}},
"C-104":{
 en:{subj:"Quick check-in on this week's volume",greet:"Hi Sam,",intro:"A short note from the seatOS team on Delta Meridian's numbers this week:",pts:["Booking volume is down 14% versus last week.","Overall usage looks healthy: 3 of 6 core features are active, so this doesn't look like a product issue.","We'd rather ask early than let a one-week dip turn into a trend."],ask:"Is there anything on your side, such as a schedule change, a partner change or a system issue, that we should know about? A quick reply is enough.",sign:"Best regards,\nChris"},
 th:{subj:"สอบถามเรื่องปริมาณการจองสัปดาห์นี้",greet:"เรียนคุณ Sam,",intro:"ทีม seatOS ขอแจ้งข้อมูลสั้นๆ เกี่ยวกับตัวเลขของ Delta Meridian ในสัปดาห์นี้:",pts:["ปริมาณการจองลดลง 14% เมื่อเทียบกับสัปดาห์ก่อน","การใช้งานโดยรวมยังดี มี 3 จาก 6 ฟีเจอร์หลักที่ใช้งานอยู่ จึงไม่น่าเป็นปัญหาจากตัวผลิตภัณฑ์","เราอยากสอบถามตั้งแต่เนิ่นๆ ก่อนที่การลดลงในสัปดาห์เดียวจะกลายเป็นแนวโน้ม"],ask:"มีอะไรทางฝั่งคุณที่เราควรทราบหรือไม่ เช่น การเปลี่ยนตารางบิน การเปลี่ยนพันธมิตร หรือปัญหาระบบ ตอบกลับสั้นๆ ก็เพียงพอ",sign:"ขอแสดงความนับถือ\nChris"},
 vi:{subj:"Hỏi thăm nhanh về lượng đặt chỗ tuần này",greet:"Kính gửi Sam,",intro:"Đội ngũ seatOS xin gửi vài dòng ngắn về số liệu tuần này của Delta Meridian:",pts:["Lượng đặt chỗ giảm 14% so với tuần trước.","Mức sử dụng chung vẫn tốt: 3 trong 6 tính năng cốt lõi đang hoạt động, nên có vẻ đây không phải vấn đề của sản phẩm.","Chúng tôi muốn hỏi sớm để mức giảm trong một tuần không trở thành xu hướng."],ask:"Có điều gì ở phía bạn mà chúng tôi nên biết không, chẳng hạn thay đổi lịch bay, đối tác hoặc sự cố hệ thống? Chỉ cần phản hồi ngắn là đủ.",sign:"Trân trọng,\nChris"},
 id:{subj:"Sekilas tanya soal volume pemesanan minggu ini",greet:"Yth. Sam,",intro:"Berikut catatan singkat dari tim seatOS mengenai angka Delta Meridian minggu ini:",pts:["Volume pemesanan turun 14% dibandingkan minggu lalu.","Penggunaan secara umum masih baik: 3 dari 6 fitur inti aktif, sehingga ini tampaknya bukan masalah produk.","Kami memilih bertanya lebih awal agar penurunan satu minggu tidak berkembang menjadi tren."],ask:"Adakah hal di pihak Anda yang perlu kami ketahui, misalnya perubahan jadwal, perubahan mitra, atau kendala sistem? Balasan singkat sudah cukup.",sign:"Hormat kami,\nChris"}},

/* ── Accounts ── */
function filtered(){
  let L=cases.slice(); const v=acc.view;
  if(v==="approval")L=L.filter(c=>c.state==="pending");
  if(v==="risk")L=L.filter(c=>c.risk>=70);
  if(v==="unhealthy")L=L.filter(c=>!c.dormant&&hOf(c)==="Unhealthy");
  if(v==="reactive")L=L.filter(c=>c.dormant);
  if(v==="healthy")L=L.filter(c=>c.state==="healthy");
  const q=acc.q.trim().toLowerCase();
  if(q)L=L.filter(c=>(c.op+" "+c.id+" "+c.owner+" "+c.contact).toLowerCase().includes(q));
  if(acc.seg!=="All")L=L.filter(c=>c.segment===acc.seg);
  if(acc.health!=="All")L=L.filter(c=>!c.dormant&&hOf(c)===acc.health);
  if(acc.pb!=="All")L=L.filter(c=>playbookOf(c)[0]===acc.pb);
  if(acc.lang!=="All")L=L.filter(c=>!c.noSend&&c.lang===acc.lang);
  const key={risk:c=>c.risk,op:c=>c.op.toLowerCase(),owner:c=>c.owner,segment:c=>c.segment,health:c=>c.dormant?-1:({Unhealthy:0,Adopted:1,Healthy:2}[hOf(c)]),playbook:c=>playbookOf(c)[0],signals:c=>c.sig.length,state:c=>c.state}[acc.sort];
  return L.sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*acc.dir});
}
function Accounts(){
  const cnt=f=>cases.filter(f).length;
  const views=[["all","All accounts",cases.length],["approval","Needs approval",cnt(c=>c.state==="pending")],["risk","At risk (≥70)",cnt(c=>c.risk>=70)],["unhealthy","Unhealthy",cnt(c=>!c.dormant&&hOf(c)==="Unhealthy")],["reactive","Reactive only",cnt(c=>c.dormant)],["healthy","Healthy · no send",cnt(c=>c.state==="healthy")]];
  const L=filtered(), pbs=[...new Set(ALLC.map(c=>playbookOf(c)[0]))];
  const sel=(k,opts,label)=>`<select data-f="${k}"><option value="All">${label}: all</option>${opts.map(o=>`<option value="${esc(o[0])}" ${acc[k]===o[0]?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
  const th=(k,l)=>`<th class="s" data-sort="${k}">${l}${acc.sort===k?(acc.dir>0?" ▲":" ▼"):""}</th>`;
  const table=`<div class="tw"><table><thead><tr>${th("op","Account")}${th("owner","Owner")}${th("segment","Segment")}${th("health","Health")}${th("playbook","Playbook")}<th>Lang</th>${th("risk","Risk")}${th("state","Status")}</tr></thead><tbody>
   ${L.map(c=>`<tr data-open="${c.id}"><td><div class="acct"><span class="av">${initials(c.op)}</span><div><b>${esc(c.op)}</b><span class="d">${c.id}${c.hs?" · "+esc(c.hs.country):" · "+esc(c.contact)}</span></div></div></td><td>${esc(ownerName(c.owner))}</td><td><span class="seg ${c.segment}">${c.segment}</span></td><td>${hlOf(c)}${c.dormant||c.hs?"":` <span class="d">${c.features}/6</span>`}</td><td><b>${playbookOf(c)[0]}</b></td><td>${c.noSend?"—":`<span class="tg llm" title="${LANGS[c.lang]}">${c.lang.toUpperCase()}</span>`}</td><td>${riskP(c)}</td><td><span class="tg st ${c.state}">${c.state}</span></td></tr>`).join("")||`<tr><td colspan="8" class="d" style="padding:30px;text-align:center">No accounts match these filters.</td></tr>`}</tbody></table></div>`;
  const cols=[["pending","To review"],["approved","Approved"],["hold","On hold"],["rejected","Returned"],["reactive","Reactive only"],["healthy","Healthy · no send"]];
  const board=`<div class="board">${cols.map(([s,l])=>{const items=L.filter(c=>c.state===s);return `<div class="col"><h3><span>${l}</span><span>${items.length}</span></h3>${items.map(c=>`<div class="kc" data-open="${c.id}"><div class="l"><b>${esc(c.op)}</b>${riskP(c)}</div><div class="d">${playbookOf(c)[0]}</div><div class="m"><span class="seg ${c.segment}">${c.segment}</span>${hlOf(c)}${c.noSend?"":`<span class="tg llm">${c.lang.toUpperCase()}</span>`}<span class="av" style="width:24px;height:24px;font-size:10px;margin-left:auto" title="${esc(ownerName(c.owner))}">${initials(ownerName(c.owner))}</span></div></div>`).join("")}</div>`}).join("")}</div>`;
  return `<div class="ph"><div><h1>Accounts</h1><div class="sub">${L.length} of ${cases.length} accounts · click a row to open the record</div></div>
    <div class="row"><button class="b ${acc.layout==="table"?"on":""}" data-layout="table">☰ Table</button><button class="b ${acc.layout==="board"?"on":""}" data-layout="board">▦ Board</button></div></div>
  <div class="tabs">${views.map(([k,l,n])=>`<button data-accview="${k}" class="${acc.view===k?"on":""}">${l}<span class="n">${n}</span></button>`).join("")}</div>
  <div class="tools"><input id="accq" data-q="1" placeholder="Search name, ID or owner…" value="${esc(acc.q)}">
    ${sel("seg",SEG.concat("Dormant").map(x=>[x,x]),"Segment")}${sel("health",HEALTH.map(x=>[x,x]),"Health")}${sel("pb",pbs.map(x=>[x,x]),"Playbook")}${sel("lang",Object.entries(LANGS),"Language")}
    <button class="b sp" data-clear="1">Clear filters</button></div>
  ${acc.layout==="table"?table:board}`;
}

/* ── Approvals ── */
function Approvals(){
  const pbs=[...new Set(rev.map(c=>playbookOf(c)[0]))];
  if(apr.pb!=="All"&&!pbs.includes(apr.pb))apr.pb="All";
  const vis=rev.filter(c=>apr.pb==="All"||playbookOf(c)[0]===apr.pb);
  if(!vis.find(c=>c.id===cur)&&vis[0])cur=vis[0].id;
  const c=vis.find(x=>x.id===cur);
  const bulkN=rev.filter(x=>playbookOf(x)[0]===apr.pb&&x.state==="pending").length;
  const strip=[["Pending",count("pending"),"pending"],["Approved",count("approved"),"approved"],["On hold",count("hold"),"hold"],["Returned",count("rejected"),"rejected"]];
  const detail=!c?`<div class="card d">Select a case.</div>`:`<div class="card ${c.state==="approved"?"":"human"}" style="${c.state==="approved"?"box-shadow:inset 0 0 0 2px var(--ok)":""}">
    <div class="lab" style="display:flex;justify-content:space-between"><span>${c.id} · ${c.play} email → ${PLAY_OUT[c.play]}</span><span class="tg st ${c.state}">${c.state}</span></div>
    <h2 style="font-size:22px;margin:6px 0"><span data-open="${c.id}" style="cursor:pointer">${esc(c.op)}</span></h2>
    <div class="row"><span class="seg ${c.segment}">${c.segment}</span>${hlOf(c)}<span class="chip" style="margin:0"><b>${playbookOf(c)[0]}</b></span>${playbookOf(c)[0]==="Rescue"?`<span class="chip" style="margin:0;background:var(--amber-bg);color:var(--amber)">📞 Requests a call</span>`:""}${c.sig.map(([,t])=>`<span class="chip" style="margin:0">${esc(t)}</span>`).join("")}</div>
    ${c.editing||c.rejecting?"":langBar(c)}
    <div class="mail" style="margin-top:12px">From: ${esc(ownerName(c.owner))}'s mailbox<br>To: ${toLine(c)}<br>Subject: ${esc(subjOf(c))}</div>
    ${c.editing?`<textarea id="ta">${esc(draftText(c))}</textarea>`:`<div class="draft">${esc(draftText(c))}</div>`}
    <div class="d">draft_hash ${c.hash} · ${LIVE?"QA not run":"QA 12/12 pass"} · token TTL 72h</div>
    ${c.note?`<div class="void">${c.note}</div>`:""}
    ${c.rejecting||c.editing?"":`<div class="row" style="margin-top:12px">${c.gen?`<span class="gen">${LIVE?"Rewriting…":"✦ Writing the new version…"}</span>`:`<span class="tg llm">${LIVE?"Template draft · v"+c.ver:"✦ Drafted by LLM · v"+c.ver}</span>`}
      <button class="b" data-a="regen" ${c.gen?"disabled":""}>Regenerate</button><button class="b ${c.mods.short?"on":""}" data-a="shorter" ${c.gen?"disabled":""}>Shorter</button><button class="b ${c.mods.warm?"on":""}" data-a="warmer" ${c.gen?"disabled":""}>Warmer</button><button class="b ${c.mods.direct?"on":""}" data-a="direct" ${c.gen?"disabled":""}>More direct</button></div>`}
    ${c.reason?`<div class="void">Returned to triage — “${esc(c.reason)}”</div>`:""}
    <div class="row" style="margin-top:16px">${c.rejecting?`<input class="inp" id="rj" placeholder="Reason (goes back to SUP-1)" style="flex:1;min-width:200px"><button class="b rj" data-a="rejgo">Confirm reject</button><button class="b" data-a="rejno">Cancel</button>`
      :c.editing?`<button class="b pri" data-a="save">Save &amp; approve</button><button class="b" data-a="cancel">Cancel</button>`
      :`<button class="b pri" data-a="approve">Approve to send</button><button class="b" data-a="edit">Edit</button><button class="b" data-a="hold">Hold</button><button class="b rj" data-a="reject">Reject</button>`}</div></div>`;
  return `<div class="ph"><div><h1>Approvals</h1><div class="sub">GATE-1 · review the draft, then approve to send Tue 09:00 · ${LIVE?"QA has not run on live data":"QA passed 12/12"}</div></div></div>
  <div class="grid g4" style="margin-bottom:18px">${strip.map(([l,n,s])=>`<div class="card ${s==="pending"?"human":""}"><div class="lab">${l}</div><div class="big">${n}</div></div>`).join("")}</div>
  <div class="tools"><button class="b ${apr.pb==="All"?"on":""}" data-pf="All">All</button>${pbs.map(p=>`<button class="b ${apr.pb===p?"on":""}" data-pf="${esc(p)}">${esc(p)} <span class="d">${rev.filter(x=>playbookOf(x)[0]===p).length}</span></button>`).join("")}
    ${apr.pb!=="All"&&bulkN?`<button class="b pri" data-bulk="1">Approve all ${esc(apr.pb)} (${bulkN})</button>`:""}</div>
  <div class="split"><div class="q">${vis.map(x=>`<button class="qi ${x.id===cur?"on":""}" data-cur="${x.id}"><div class="l1"><b>${esc(x.op)}</b>${riskP(x)}</div><div class="l2"><span>${esc(ownerName(x.owner))} · ${x.segment} · ${hOf(x)} · ${x.lang.toUpperCase()}</span><span class="tg st ${x.state}" style="padding:1px 9px">${x.state}</span></div></button>`).join("")||`<div class="d" style="padding:20px">No cases.</div>`}</div>${detail}</div>`;
}

/* ── Sent ── */
function Sent(){
  const rows=sendLog.filter(r=>cases.some(c=>c.id===r.case));
  return `<div class="ph"><div><h1>Sent</h1><div class="sub">Tue 09:00 · deterministic send · no model call</div></div></div>
  <div class="grid g4" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">${[["OUT-1","Retention","operator-specific"],["OUT-2","Adoption","feature gap"],["OUT-3","Commercial","fare position"]].map(([o,t,d])=>`<div class="card"><div class="lab" style="display:flex;justify-content:space-between"><span>${o}</span><span>CODE</span></div><div class="d" style="margin-top:6px">${t}</div><div class="big">${queued(o)}</div><div class="d">queued · ${d}</div></div>`).join("")}</div>
  <div class="tw"><table><thead><tr><th>Account</th><th>Case</th><th>Channel</th><th>Token</th><th>draft_hash</th><th>Outcome</th></tr></thead><tbody>
  ${rows.map(r=>{const c=byId(r.case);return `<tr data-open="${c.id}"><td><b>${esc(c.op)}</b></td><td>${c.id}</td><td>${r.out}</td><td>tok_${r.tok}</td><td>${r.hash}</td><td><span class="tg st pending">queued Tue 09:00</span></td></tr>`}).join("")||`<tr><td colspan="6" class="d" style="padding:30px;text-align:center">Nothing approved yet.</td></tr>`}</tbody></table></div>`;

/* ── shell ── */
function render(){
  applyOwner();nav();
  const y=scrollY;
  $("#main").innerHTML=({home:Home,accounts:Accounts,record:Record,approvals:Approvals,sent:Sent}[view])();
  if(render.keep){scrollTo(0,y)}
}
function decide(c,state,extra,msg){
  Object.assign(c,extra||{},{state});
  if(state==="approved"){c.note="";sendLog.push({case:c.id,out:PLAY_OUT[c.play],tok:rid(),hash:c.hash});ev(c,"ok",`Approved by Chris · queued for Tue 09:00 (${LANGS[c.lang]})`)}
  if(state==="rejected")ev(c,"bad",`Returned to triage: “${c.reason}”`);
  if(state==="hold")ev(c,"note","Put on hold by Chris");
  const nx=rev.find(x=>x.state==="pending");if(nx)cur=nx.id;
  toast(msg||({approved:"Approved · queued for Tue 09:00",rejected:"Returned to triage",hold:"Put on hold"}[state]));
  render();
}
function llmApply(c,fn,what){
  if(c.gen)return;c.gen=true;render();
  setTimeout(()=>{fn(c);c.hash=rid();c.ver++;c.gen=false;
    if(c.state==="approved"){const i=sendLog.findIndex(r=>r.case===c.id);if(i>-1)sendLog.splice(i,1);c.state="pending";c.note="Draft changed after approval — the approval token no longer matches, so it needs approval again.";ev(c,"bad","Approval voided: draft changed")}
    else c.note="";
    ev(c,"ai",what);render();},700);
}
function llmRewrite(c,mode){
  const k={shorter:"short",warmer:"warm",direct:"direct"}[mode];
  llmApply(c,c=>{c.custom[c.lang]="";if(mode==="regen")c.alt=((c.alt||0)+1)%3;else c.mods[k]=!c.mods[k]},mode==="regen"?"AI regenerated the draft":`AI rewrote the draft (${mode})`);
}
function setSb(hide){document.body.classList.toggle("nosb",hide);try{localStorage.setItem("cs.sb",hide?"1":"0")}catch(e){}$("#sbtop").title=hide?"Show sidebar":"Hide sidebar"}
try{if(localStorage.getItem("cs.sb")==="1")setSb(true)}catch(e){}
addEventListener("keydown",e=>{if((e.key==="\\"||e.key==="[")&&!/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||"")))setSb(!document.body.classList.contains("nosb"))});
function openRecord(id,tab){view="record";recId=id;rtab=tab||"overview";$("#gres").style.display="none";$("#gsearch").value="";scrollTo(0,0);render()}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-sb],[data-nav],[data-open],[data-review],[data-kpi],[data-sort],[data-accview],[data-layout],[data-clear],[data-rtab],[data-note],[data-pf],[data-bulk],[data-cur],[data-lang],[data-a]");
  if(!t){if(!e.target.closest(".search"))$("#gres").style.display="none";return}
  const D=t.dataset;
  if(D.sb)return setSb(!document.body.classList.contains("nosb"));
  if(D.nav){view=D.nav;scrollTo(0,0);return render()}
  if(D.open)return openRecord(D.open);
  if(D.review){cur=D.review;apr.pb="All";view="approvals";scrollTo(0,0);return render()}
  if(D.kpi){const k=D.kpi;if(k==="gate"){view="approvals"}else{view="accounts";acc.view=k==="risk"?"risk":"all"}scrollTo(0,0);return render()}
  if(D.sort){if(acc.sort===D.sort)acc.dir*=-1;else{acc.sort=D.sort;acc.dir=D.sort==="op"||D.sort==="owner"?1:-1}return render()}
  if(D.accview){acc.view=D.accview;return render()}
  if(D.layout){acc.layout=D.layout;return render()}
  if(D.clear){acc={...acc,view:"all",q:"",seg:"All",health:"All",pb:"All",lang:"All"};return render()}
  if(D.rtab){rtab=D.rtab;return render()}
  if(D.note){const i=$("#notein"),v=i.value.trim();if(!v)return;const c=byId(recId);ev(c,"note","Note · "+v);toast("Note added");return render()}
  if(D.pf){apr.pb=D.pf;return render()}
  if(D.bulk){rev.filter(c=>playbookOf(c)[0]===apr.pb&&c.state==="pending").forEach(c=>{c.state="approved";sendLog.push({case:c.id,out:PLAY_OUT[c.play],tok:rid(),hash:c.hash});ev(c,"ok",`Approved by Chris (bulk · ${apr.pb})`)});toast(`Approved all ${apr.pb}`);return render()}
  if(D.cur){cur=D.cur;return render()}
  if(D.lang){const c=byId(D.c||cur);if(c&&D.lang!==c.lang)llmApply(c,c=>{c.lang=D.lang},`AI rewrote the draft in ${LANGS[D.lang]}`);return}
  const c=byId(cur);if(!c||!D.a)return;
  switch(D.a){
   case"regen":case"shorter":case"warmer":case"direct":return llmRewrite(c,D.a);
   case"approve":return decide(c,"approved");
   case"hold":return decide(c,"hold");
   case"reject":c.rejecting=true;return render();
   case"rejno":c.rejecting=false;return render();
   case"rejgo":c.rejecting=false;return decide(c,"rejected",{reason:$("#rj").value||"no reason"});
   case"edit":c.editing=true;return render();
   case"cancel":c.editing=false;return render();
   case"save":c.custom[c.lang]=$("#ta").value;c.hash=rid();c.editing=false;ev(c,"note","Draft edited by Chris");return decide(c,"approved");
  }
});
document.addEventListener("change",e=>{
  const s=e.target.closest("select[data-f]");if(s){acc[s.dataset.f]=s.value;render()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="accq"){const p=e.target.selectionStart;acc.q=e.target.value;render();const i=$("#accq");i.focus();i.setSelectionRange(p,p)}
  if(e.target.id==="gsearch"){
    const q=e.target.value.trim().toLowerCase(),r=$("#gres");
    if(!q){r.style.display="none";return}
    const m=ALLC.filter(c=>(c.op+" "+c.id+" "+c.contact+" "+c.owner).toLowerCase().includes(q));
    r.innerHTML=m.map(c=>`<div class="it" data-open="${c.id}"><span><b>${esc(c.op)}</b> <span class="d">${c.id}</span></span><span class="d">${playbookOf(c)[0]}</span></div>`).join("")||`<div class="it d">No accounts found</div>`;
    r.style.display="block";
  }
});
document.addEventListener("toggle",e=>{if(e.target.id==="d-mx")openMx=e.target.open;if(e.target.id==="d-guide")openGuide=e.target.open},true);
(function(){
  const sel=$("#ownersel"),owners=[...new Set(ALLC.map(c=>c.owner))];
  sel.innerHTML=`<option value="All">All owners (${ALLC.length})</option>`+owners.map(o=>`<option value="${esc(o)}">${esc(ownerName(o))} (${ALLC.filter(c=>c.owner===o).length})</option>`).join("");
  sel.addEventListener("change",()=>{ownerF=sel.value;sel.parentNode.classList.toggle("on",ownerF!=="All");acc.view="all";apr.pb="All";render()});
})();
if(LIVE){const b=$("#srcbadge");b.innerHTML=`<span class="tg" style="background:#e6f6ec;color:#3f9a5b">● HubSpot live data</span> &nbsp;${esc(HS_META.portal)} · pulled ${HS_META.pulledAt} · ${ALLC.length} accounts`}
render();
</script>
</body>
</html>
